;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               COLORS                        ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[colors]
background     = #4C566A
background-alt = #D8DEE9
foreground     = #8FBCBB
primary        = #81A1C1
secondary      = #BF616A
alert          = #FFFFFF
disabled       = #B48EAD

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               TOP BAR                       ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/top]
width  = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size  = 4pt
border-color = #00000000

padding-left  = 0
padding-right = 1

module-margin = 1

separator            = |
separator-foreground = ${colors.disabled}

font-0 = monospace;2

modules-left  = xworkspaces  xwindow
modules-right =  pulseaudio xkeyboard Network

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               BOTTOM BAR                    ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/bottom]
width  = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size  = 4pt
border-color = #00000000

padding-left  = 0
padding-right = 1

module-margin = 1

separator            = |
separator-foreground = ${colors.disabled}

font-0 = monospace;2

modules-left = filesystem Light battery wireless-network
modules-right = memory cpu cpu-temp date

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true
bottom     = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               MODULES                       ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;
; WorkSpaces  ;
;;;;;;;;;;;;;;;
[module/xworkspaces]
type = internal/xworkspaces

label-active            = %name%
label-active-background = ${colors.background-alt}
label-active-underline  = ${colors.primary}
label-active-padding    = 1

label-occupied         = %name%
label-occupied-padding = 1

label-urgent            = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding    = 1

label-empty            = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding    = 1

;;;;;;;;;;;;;;;
; Xwindow     ;
;;;;;;;;;;;;;;;
[module/xwindow]
type  = internal/xwindow
label = %title:0:60:...%

;;;;;;;;;;;;;;;
; FileSystem  ;
;;;;;;;;;;;;;;;
[module/filesystem]
type     = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted            = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

;;;;;;;;;;;;;;;
; Audio       ;
;;;;;;;;;;;;;;;
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix            = "VOL: "
format-volume-prefix-foreground = ${colors.primary}
format-volume                   = <label-volume>

label-volume = %percentage%%

label-muted            = muted
label-muted-foreground = ${colors.disabled}

;;;;;;;;;;;;;;;
; Keyboard    ;
;;;;;;;;;;;;;;;
[module/xkeyboard]
type        = internal/xkeyboard
blacklist-0 = num lock

label-layout            = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding    = 2
label-indicator-margin     = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

;;;;;;;;;;;;;;;
; Memory      ;
;;;;;;;;;;;;;;;
[module/memory]
type          = internal/memory
interval      = 2

format-prefix            = "RAM: "
format-prefix-foreground = ${colors.primary}

label = %percentage_used:2%%

;;;;;;;;;;;;;;;
; CPU         ;
;;;;;;;;;;;;;;;
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU: "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

;;;;;;;;;;;;;;;
; DATE        ;
;;;;;;;;;;;;;;;
[module/date]
type     = internal/date
interval = 1

date     = %I:%M
date-alt = %Y-%m-%d %I:%M:%S

format-prefix    = "TIME: "
label            = %date%
label-foreground = ${colors.primary}


[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5
;   Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current charge rate in watts)
label-charging = Battery Charging -> %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
label-discharging = Battery Discharging -> %percentage%%

[settings]
screenchange-reload = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               CUSTOM                        ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;
; CPU         ;
;;;;;;;;;;;;;;;
[module/cpu-temp]
type = custom/script
exec = ~/.config/CustomScripts/cpu-temp.sh

interval = 1

format-prefix            = "TEMP: "
format-prefix-foreground = ${colors.primary}

;;;;;;;;;;;;;;;
; BackLight   ;
;;;;;;;;;;;;;;;
[module/Light]
type = custom/script
exec = ~/.config/CustomScripts/light.sh

interval = 10

format-prefix            = "BackLight: "
format-prefix-foreground = ${colors.primary}

[module/Network]
type = custom/script
exec = ~/.config/CustomScripts/ip_address.sh

interval = 20

format-prefix            = "Network: "
format-prefix-foreground = ${colors.primary}
