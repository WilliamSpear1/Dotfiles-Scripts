;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               COLORS                        ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[colors]
snowstorm      = #D8DEE9
transparency   = #00000000
background-alt = #B48EAD
nightshade     = #4C566A
darkocean      = #2E3440
primary        = #81A1C1
secondary      = #BF616A
alert          = #FFFFFF
disabled       = #B48EAD
green-aqua     = #8FBCBB
light-blue     = #81A1C1
frost-blue     = #88C0D0
purple-frost   = #B48EAD
ocean-blue     = #5E81AC
bloodred       = #BF616A

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               EXTERNAL BAR                  ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/external]
width    = 150%
height   = 22pt
radius   = 6
offset-x = 1%
offset-y = 1%

monitor = HDMI-1

background = ${colors.darkocean}
foreground = ${colors.nightshade}

line-size = 3pt

border-size  = 4pt
border-color = ${colors.nightshade}

padding-left  = 0 
padding-right = 3

module-margin = 1 

#######################
#    Fonts            #
#######################
font-0 = "JetBrainsMono Nerd Font:size=15;2"
font-1 = "Font Awesome 6 Free Solid:antialias=false:style=Regular:pixelsize=60;15"
font-2 = "JetBrainsMono Nerd Font:size=15;2"
font-3 = "JetBrainsMono Nerd Font:size=15;2"

#######################
#    Modules          #
#######################
modules-left  = xworkspaces xwindow filesystem packages 
modules-right = pulseaudio Network cpu cpu-temp date powermenu

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               TOP BAR                       ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/top]
width  = 100%
height = 24pt
radius = 6

background = ${colors.darkocean}
foreground = ${colors.nightshade}

line-size = 3pt

border-size  = 4pt
border-color = ${colors.nightshade}

padding-left  = 0
padding-right = 1

module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=15;2"
font-1 = "Font Awesome 6 Free Solid:antialias=false:style=Regular:pixelsize=60;15"
font-2 = "JetBrainsMono Nerd Font:size=15;2"
font-3 = "JetBrainsMono Nerd Font:size=15;2"

modules-left  = xworkspaces xwindow Network cpu-temp
modules-right = cpu-temp pulseaudio packages powermenu

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               BOTTOM BAR                    ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/bottom]
width  = 100%
height = 24pt
radius = 6

background = ${colors.darkocean}
foreground = ${colors.nightshade}

line-size = 3pt

border-size  = 4pt
border-color = ${colors.nightshade}

padding-left  = 3
padding-right = 3

module-margin = 3

font-0 = "JetBrainsMono Nerd Font:size=15;2"
font-1 = "Font Awesome 6 Free Solid:antialias=false:style=Regular:pixelsize=60;15"
font-2 = "JetBrainsMono Nerd Font:size=15;2"
font-3 = "JetBrainsMono Nerd Font:size=15;2"

#modules-left  = filesystem arrow9 Light arrow5 battery arrow10
#modules-right = arrow6 packages arrow11 memory arrow2 cpu arrow12 date arrow13 xkeyboard

modules-left  = battery 
modules-right = memory cpu date xkeyboard

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true
bottom     = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               MODULES                       ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

###############
# WorkSpaces  #
###############
[module/xworkspaces]
type = internal/xworkspaces

label-active            = %name%
label-active-background = ${colors.darkocean}
;label-active-underline  = ${colors.ocean-blue}
label-active-foreground = ${colors.snowstorm}
label-active-padding    = 1

label-occupied         = %name%
label-occupied-padding = 1
label-occupied-background = ${colors.darkocean}
;label-inactive-occupied-baackground = ${colors.bloodred}

label-urgent            = %name%
;label-urgent-background = ${colors.green-aqua}
label-urgent-padding    = 1

label-empty            = %name%
;label-empty-foreground = ${colors.nightshade}
;label-empty-background = ${colors.ocean-blue}
label-empty-padding    = 1

;;;;;;;;;;;;;;;
; Xwindow     ;
;;;;;;;;;;;;;;;
[module/xwindow]
type  = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.bloodred}

;;;;;;;;;;;;;;;
; FileSystem  ;
;;;;;;;;;;;;;;;
[module/filesystem]
type     = internal/fs
interval = 25

mount-0 = /
label-mounted =  :%{F-} %percentage_used%%
label-mounted-foreground = ${colors.light-blue}
label-unmounted            = %mountpoint% not mounted
label-unmounted-foreground = ${colors.light-blue}

;;;;;;;;;;;;;;;
; Audio       ;
;;;;;;;;;;;;;;;
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix     = " :"
format-volume            = <label-volume>
format-volume-background = ${colors.darkocean}
format-volume-foreground = ${colors.green-aqua}

label-volume           = %percentage%%
label-muted            = MUTED
label-muted-foreground = ${colors.bloodred}
label-muted-background = ${colors.darkocean}

;;;;;;;;;;;;;;;
; Keyboard    ;
;;;;;;;;;;;;;;;
[module/xkeyboard]
type        = internal/xkeyboard
blacklist-0 = num lock

label-layout            =  :%layout%

label-indicator-padding    = 2
label-indicator-margin     = 1

format-foreground = ${colors.light-blue}

;;;;;;;;;;;;;;;
; Memory      ;
;;;;;;;;;;;;;;;
[module/memory]
type          = internal/memory
interval      = 2

format-prefix = " 󰄌 :"

label = %percentage_used:2%%
format-foreground = ${colors.green-aqua}

;;;;;;;;;;;;;;;
; CPU         ;
;;;;;;;;;;;;;;;
[module/cpu]
type = internal/cpu
interval = 2
format-foreground = ${colors.frost-blue}
format-prefix = " :"
label = %percentage:2%%

;;;;;;;;;;;;;;;
; DATE        ;
;;;;;;;;;;;;;;;
[module/date]
type     = internal/date
interval = 1

date     = %I:%M
date-alt = %Y-%m-%d %I:%M:%S

format-prefix     = " :"
format-foreground = ${colors.frost-blue}
label             = %date%
;;;;;;;;;;;;;;;
; Battery     ;
;;;;;;;;;;;;;;;
[module/battery]
type = internal/battery


low-at  = 5

battery = BAT0
adapter = ADP1

poll-interval = 5

label-charging    = 󰂄 :%percentage%%
label-discharging = 󰂆 :%percentage%%
label-full        = 󰁹

label-full-foreground        = ${colors.frost-blue}
label-charging-foreground    = ${colors.purple-frost}
label-discharging-foreground = ${colors.bloodred}

[settings]
screenchange-reload = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               CUSTOM                        ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;
; CPU         ;
;;;;;;;;;;;;;;;
[module/cpu-temp]
type = custom/script
exec = ~/.config/CustomScripts/cpu-temp.sh
interval = 1

format-foreground = ${colors.light-blue}
format-prefix     = " :"

[module/Network]
type = custom/script
exec = ~/.config/CustomScripts/ip_address.sh

interval = 20

format-foreground = ${colors.light-blue}
format-prefix     = "󰒋 :"

;;;;;;;;;;;;;;;
; PACKAGES    ;
;;;;;;;;;;;;;;;
[module/packages]
type = custom/script
exec = ~/.config/CustomScripts/packages.sh
interval = 1

format-foreground = ${colors.frost-blue}
format-prefix     = "󰏗 :"

;;;;;;;;;;;;;;;
; POWER MENU  ;
;;;;;;;;;;;;;;;
[module/powermenu]
type = custom/text
content-foreground = ${colors.frost-blue}
content    = "󰐥"
click-left = exec ~/.config/CustomScripts/power_menu.sh
