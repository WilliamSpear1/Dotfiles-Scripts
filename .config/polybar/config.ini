;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               COLORS                        ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[colors]
snowstorm        = #D8DEE9
transparency     = #00000000
background-alt   = #B48EAD
nightshade       = #4C566A
darkocean        = #2E3440
primary          = #81A1C1
secondary        = #BF616A
alert            = #FFFFFF
disabled         = #B48EAD
green-aqua       = #8FBCBB
light-blue       = #81A1C1
frost-blue       = #88C0D0
purple-frost     = #B48EAD
ocean-blue       = #5E81AC
bloodred         = #BF616A

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               EXTERNAL BAR                  ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/external]
width  = 100%
height = 24pt
radius = 6

monitor = HDMI-1

background = ${colors.transparency}
foreground = ${colors.nightshade}

line-size = 3pt

border-size  = 4pt
border-color = #00000000

padding-left  = 0
padding-right = 0

module-margin = 0

font-0 = "Profont For Powerline:style=Regular:pixelsize=13;4"

font-1 = "fontawesome:antialias=false:style=Regular:pixelsize=70;17"

modules-left  = xworkspaces arrow5 xwindow arrow4
modules-right = arrow0 arrow1 pulseaudio arrow2 Network arrow3 fan-level arrow1 fan-speed arrow2 cpu arrow3 cpu-temp arrow1 date

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               TOP BAR                       ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/top]
width  = 100%
height = 24pt
radius = 6

background = ${colors.transparency}
foreground = ${colors.darkocean}

line-size = 3pt

border-size  = 4pt
border-color = #00000000

padding-left  = 0
padding-right = 0

module-margin = 0

font-0 = "Profont For Powerline:style=Regular:pixelsize=17;4"
font-1 = "fontawesome:antialias=false:style=Regular:pixelsize=70;17"

modules-left  = xworkspaces arrow5 xwindow arrow8
modules-right = arrow6 fan-level arrow1 fan-speed arrow2 Network arrow3 cpu-temp arrow1 pulseaudio 

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               BOTTOM BAR                    ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[bar/bottom]
width  = 100%
height = 24pt
radius = 6

background = ${colors.transparency}
foreground = ${colors.darkocean}

line-size = 3pt

border-size  = 4pt
border-color = #00000000

padding-left  = 0
padding-right = 0

module-margin = 0

font-0 = "Profont For Powerline:style=Regular:pixelsize=17;4"
font-1 = "fontawesome:antialias=false:style=Regular:pixelsize=70;17"

modules-left  = filesystem arrow9 Light arrow5 battery arrow10
modules-right = arrow11 memory arrow2 cpu arrow12 date arrow13 xkeyboard

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true
bottom     = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               MODULES                       ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;
; WorkSpaces  ;
;;;;;;;;;;;;;;;
[module/xworkspaces]
type = internal/xworkspaces

label-active            = %name%
label-active-background = ${colors.ocean-blue}
label-active-underline  = ${colors.ocean-blue}
label-active-foreground = ${colors.snowstorm}
label-active-padding    = 1



label-occupied         = %name%
label-occupied-padding = 1
label-occupied-background = ${colors.ocean-blue}

label-urgent            = %name%
label-urgent-background = ${colors.green-aqua}
label-urgent-padding    = 1

label-empty            = %name%
label-empty-foreground = ${colors.nightshade}
label-empty-padding    = 1

;;;;;;;;;;;;;;;
; Xwindow     ;
;;;;;;;;;;;;;;;
[module/xwindow]
type  = internal/xwindow
label = %title:0:60:...%
label-background = ${colors.purple-frost}

;;;;;;;;;;;;;;;
; FileSystem  ;
;;;;;;;;;;;;;;;
[module/filesystem]
type     = internal/fs
interval = 25

;mount-0 = /

mount-0 = /home

label-mounted = %{F#88C0D0}%mountpoint%%{F-} %percentage_used%%
label-mounted-background = ${colors.bloodred}

label-unmounted            = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

;;;;;;;;;;;;;;;
; Audio       ;
;;;;;;;;;;;;;;;
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix            = "VOL: "
format-volume                   = <label-volume>
format-volume-background        = ${colors.green-aqua}

label-volume            = %percentage%%
label-muted             = muted

;;;;;;;;;;;;;;;
; Keyboard    ;
;;;;;;;;;;;;;;;
[module/xkeyboard]
type        = internal/xkeyboard
blacklist-0 = num lock

label-layout            = %layout%

label-indicator-padding    = 2
label-indicator-margin     = 1

format-background = ${colors.bloodred}

;;;;;;;;;;;;;;;
; Memory      ;
;;;;;;;;;;;;;;;
[module/memory]
type          = internal/memory
interval      = 2

format-prefix = "RAM: "

label = %percentage_used:2%%
format-background = ${colors.green-aqua}

;;;;;;;;;;;;;;;
; CPU         ;
;;;;;;;;;;;;;;;
[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.light-blue}

format-prefix = "CPU: "
label = %percentage:2%%

;;;;;;;;;;;;;;;
; DATE        ;
;;;;;;;;;;;;;;;
[module/date]
type     = internal/date
interval = 1

date     = %I:%M
date-alt = %Y-%m-%d %I:%M:%S

format-prefix     = "TIME: "
format-background = ${colors.green-aqua}
label-background  = ${colors.green-aqua}
label             = %date%

[module/battery]
type = internal/battery

full-at = 99
low-at  = 5

battery = BAT0
adapter = ADP1

poll-interval = 5

label-charging    = Battery Charging -> %percentage%%
label-discharging = Battery Discharging -> %percentage%%

label-full-background        = ${colors.purple-frost}
label-charging-background    = ${colors.purple-frost}
label-discharging-background = ${colors.purple-frost}

[settings]
screenchange-reload = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;               CUSTOM                        ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;
; CPU         ;
;;;;;;;;;;;;;;;
[module/cpu-temp]
type = custom/script
exec = ~/.config/CustomScripts/cpu-temp.sh
interval = 1

format-background = ${colors.frost-blue}
format-prefix     = "TEMP: "

;;;;;;;;;;;;;;;
; BackLight   ;
;;;;;;;;;;;;;;;
[module/Light]
type = custom/script
exec = ~/.config/CustomScripts/light.sh
interval = 10

format-background = ${colors.ocean-blue}
format-prefix     = "BackLight: "

[module/Network]
type = custom/script
exec = ~/.config/CustomScripts/ip_address.sh

interval = 20

format-background = ${colors.light-blue}
format-prefix     = "Network: "

;;;;;;;;;;;;;;;
; FAN         ;
;;;;;;;;;;;;;;;
[module/fan-level]
type = custom/script
exec = ~/.config/CustomScripts/fan-level.sh
interval = 1

format-background = ${colors.frost-blue}
format-prefix     = "FAN-LEVEL: "

;;;;;;;;;;;;;;;
; FAN         ;
;;;;;;;;;;;;;;;
[module/fan-speed]
type = custom/script
exec = ~/.config/CustomScripts/fan-speed.sh
interval = 1

format-background = ${colors.green-aqua}
format-prefix     = "FAN-SPEED: "

