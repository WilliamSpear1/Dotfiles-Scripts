# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# automatic renumbering of windows in tmux
set -g renumber-windows on

# Resizie the current pane using Alt + direction
bind -n M-k resize-pane -U 15
bind -n M-j resize-pane -D 15
bind -n M-h resize-pane -L 15
bind -n M-l resize-pane -R 15

set-option -s set-clipboard off 
bind P paste-buffer 
bind-key -T copy-mode-vi v send-keys -X begin-selection 
bind-key -T copy-mode-vi y send-keys -X rectangle-toggle 
unbind -T copy-mode-vi Enter 
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i' 
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'christone/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'

#source /usr/share/powerline/bindings/tmux/powerline.conf
run '~/.tmux/plugins/tmux-sensible/sensible.tmux'
run '~/.tmux/plugins/nord-tmux/nord.tmux'
run -b '~/.tmux/plugins/tpm/tpm'
